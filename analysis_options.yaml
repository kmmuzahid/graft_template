include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    analysis_options_deprecated_plugins: ignore
    unrecognized_error_code: ignore
    avoid_nested_graft_slot: error
    prefer_props_in_graft_state: error
    require_graft_route_observer: error
    require_dry_schema_version: error
    require_model_factory_in_dry_state: error
    require_model_schema_version_in_dry_state: error
    require_dry_default_constructor: error
    require_model_default_constructor: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

custom_lint:
  rules:
    - avoid_nested_graft_slot: true
    - prefer_props_in_graft_state: true
    - require_graft_route_observer: true
    - require_dry_schema_version: true
    - require_model_factory_in_dry_state: true
    - require_model_schema_version_in_dry_state: true
    - require_dry_default_constructor: true
    - require_model_default_constructor: true
