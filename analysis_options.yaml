analyzer:
  errors:
    analysis_options_deprecated_plugins: ignore
  plugins:
    - custom_lint
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

custom_lint:
  rules:
    - avoid_nested_graft_slot: true
    - prefer_props_in_graft_state: true
    - require_graft_route_observer: true
